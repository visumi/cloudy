name: Deploy API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "wrangler.jsonc", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TURSO_URL" && test -n "$TURSO_AUTH_TOKEN" && test -n "$FIREBASE_PROJECT_ID" && test -n "$OWNER_EMAIL"
          trap 'rm -f .worker-secrets.json' EXIT
          node -e 'require("fs").writeFileSync(".worker-secrets.json", JSON.stringify(Object.fromEntries(["TURSO_URL","TURSO_AUTH_TOKEN","FIREBASE_PROJECT_ID","OWNER_EMAIL"].map((name) => [name, process.env[name]]))))'
          npx wrangler secret bulk .worker-secrets.json
      - run: npx wrangler deploy --minify
